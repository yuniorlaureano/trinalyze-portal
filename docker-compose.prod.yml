# Production stack for the VPS. Local development still uses the plain
# docker-compose.yml (Postgres only) + `npm run develop` / `npm run dev`.
#
# Usage on the VPS:
#   cp .env.production.example .env
#   # fill in real values in .env, then:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# docker compose automatically reads a file named `.env` in this same
# directory for the ${VAR} substitutions below.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    # No `ports:` — Postgres is only reachable from other containers on
    # this network, never from the public internet.

  cms:
    build:
      context: ./cms
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    volumes:
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ./web
      args:
        PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      STRAPI_URL: http://cms:1337
      PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
    depends_on: [cms]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "1337:1337"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, cms]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  strapi_uploads:
  caddy_data:
  caddy_config:
