# Production stack for Coolify. Same services as docker-compose.prod.yml,
# minus Caddy — Coolify runs its own reverse proxy (Traefik) and handles
# routing/HTTPS itself, so a second reverse proxy in this file would
# conflict with it.
#
# Configure the public domain/port for each service (cms, web) from the
# Coolify UI — that's what replaces the Caddyfile here.
#
# Env vars (DATABASE_*, APP_KEYS, PUBLIC_STRAPI_URL, etc.) are the same
# ones documented in .env.production.example / DEPLOY.md — set them as
# Coolify environment variables for this resource instead of a local
# .env file.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    # No `ports:` — Postgres is only reachable from other containers on
    # this network, never from the public internet.

  cms:
    build:
      context: ./cms
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    volumes:
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ./web
      args:
        PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      STRAPI_URL: http://cms:1337
      PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
    depends_on: [cms]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  strapi_uploads:
