# Production stack for Coolify. Same services as docker-compose.prod.yml,
# including a `caddy` service — but unlike docker-compose.prod.yml, this
# Caddy has no published ports. Coolify's own Traefik stays the one
# public entry point; Caddy only exists internally, to split static
# asset requests (images, CSS, Astro's hashed JS/CSS chunks) away from
# the single Node process so they don't queue up behind SSR rendering
# under load — see DEPLOY.md's "Extra" section for the measurements.
#
# In the Coolify UI, point the public domain at the `caddy` service on
# port 80 (not at `web` on port 4321) — Caddy decides internally which
# requests go straight to a static file and which go to `web`.
#
# Configure cms's public domain/port from the Coolify UI same as before
# — that part is unchanged.
#
# Env vars (DATABASE_*, APP_KEYS, PUBLIC_STRAPI_URL, etc.) are the same
# ones documented in .env.production.example / DEPLOY.md — set them as
# Coolify environment variables for this resource instead of a local
# .env file.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    # No `ports:` — Postgres is only reachable from other containers on
    # this network, never from the public internet.

  cms:
    build:
      context: ./cms
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    volumes:
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ./web
      args:
        PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      STRAPI_URL: http://cms:1337
      PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    volumes:
      # Shared with caddy below — see the top-of-file comment and
      # DEPLOY.md's "Extra" section.
      - web_static:/app/dist/client
    depends_on: [cms]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # No `ports:` on purpose — Coolify's Traefik is the only public
    # entry point. Point your domain at this service, port 80, from the
    # Coolify UI.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - web_static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, cms]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  strapi_uploads:
  web_static:
  caddy_data:
  caddy_config:
